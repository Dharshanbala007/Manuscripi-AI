# IEEE format profile.
#
# provenance per group:
#   implemented  - a widely-documented IEEE conference-template fact, encoded on purpose
#   configurable - a knob with a sensible default; change it here, not in code
#   inferred     - a reasonable value chosen for this project, not from an official source
#   unsupported  - the engine cannot currently enforce this
#
# The product never claims "IEEE compliant" - only "IEEE format profile applied"
# and, after validation, "IEEE validation checks passed" for the checks it ran.

id: ieee
name: IEEE
summary: Two-column academic layout with structured headings and IEEE-style references.
status: available
features:
  - Two-column US Letter layout
  - 10 pt Times New Roman body
  - Roman-numeral section headings
  - "Abstract— and Index Terms— run-in blocks"
  - "Bracketed [n] references with hanging indent"

page:
  provenance: implemented
  note: US Letter with IEEE conference margins.
  size: letter
  margin_top_in: 0.75
  margin_bottom_in: 1.0
  margin_left_in: 0.625
  margin_right_in: 0.625

columns:
  provenance: implemented
  note: IEEE conference papers are two-column.
  count: 2
  spacing_in: 0.25

base_font:
  provenance: implemented
  note: 10 pt Times New Roman body text.
  family: Times New Roman
  size_pt: 10.0

spacing:
  provenance: inferred
  note: Single line spacing; exact lead values are not encoded.
  line: 1.0
  paragraph_before_pt: 0.0
  paragraph_after_pt: 0.0

title:
  provenance: inferred
  note: Centered ~24 pt; the official template value is approximate here.
  size_pt: 24.0
  bold: false
  italic: false
  align: center
  case: as_is

author:
  provenance: inferred
  note: Centered author block below the title.
  size_pt: 10.0
  align: center
  italic: false

affiliation:
  provenance: inferred
  note: Centered italic affiliation lines.
  size_pt: 9.0
  align: center
  italic: true

abstract:
  provenance: implemented
  note: "Bold 'Abstract—' run-in lead-in; 9 pt body."
  heading_text: Abstract
  inline_lead_in: true
  size_pt: 9.0
  bold_label: true
  italic_body: false
  align: justify

keywords:
  provenance: implemented
  note: "'Index Terms—' italic run-in block."
  label: Index Terms
  size_pt: 9.0
  italic: true
  separator: ", "

headings:
  provenance: implemented
  note: >
    Level 1 uppercase, centered, roman-numeral numbered; level 2 italic title-case
    with letter numbering; level 3 italic run-in. Run-in rendering (level 3 inline
    with the paragraph) is not applied by the engine.
  levels:
    1:
      size_pt: 10.0
      bold: false
      italic: false
      align: center
      case: upper
      numbering: roman-upper
      space_before_pt: 12.0
      space_after_pt: 6.0
    2:
      size_pt: 10.0
      bold: false
      italic: true
      align: left
      case: title
      numbering: alpha-upper
      space_before_pt: 8.0
      space_after_pt: 4.0
    3:
      size_pt: 10.0
      bold: false
      italic: true
      align: left
      case: as_is
      numbering: none
      space_before_pt: 6.0
      space_after_pt: 3.0

paragraphs:
  provenance: inferred
  note: First-line indent; justified body.
  first_line_indent_in: 0.2
  align: justify

captions:
  provenance: implemented
  note: >
    Figure captions read "Fig. N." below the figure; table captions read
    "TABLE N" above the table. Small-caps table titles are not applied.
  figure:
    prefix: "Fig."
    numbering: decimal
    separator: ". "
    size_pt: 8.0
    italic: false
    align: left
    position: below
    case: as_is
  table:
    prefix: "TABLE"
    numbering: roman-upper
    separator: "\n"
    size_pt: 8.0
    italic: false
    align: center
    position: above
    case: upper

tables:
  provenance: configurable
  note: Grid style with a bold header row; a table wider than the column is scaled
    down to fit (columns keep their proportions, text just wraps). Tables with too
    many columns to stay readable at that width are flagged instead.
  style_name: Table Grid
  header_bold: true

figures:
  provenance: configurable
  note: Centered, single-column width; oversize figures are flagged, never scaled.
  max_width_in: 3.4
  center: true
  oversize_action: flag

references:
  provenance: implemented
  note: "8 pt, bracketed [n] numbering with a hanging indent."
  style: numeric-bracket
  size_pt: 8.0
  hanging_indent_in: 0.2
  numbering: bracket

validation:
  provenance: configurable
  note: Thresholds the validator uses when checking the formatted output.
  body_font_tolerance_pt: 0.75
  require_abstract: true
  require_keywords: true
  max_table_cols_before_flag: 8
